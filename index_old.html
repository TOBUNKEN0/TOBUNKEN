<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<title>3D Cultural Heritage Viewer</title>

<script type="module"
src="https://unpkg.com">
</script>

<style>
body {
  margin: 0;
  display: flex;
  height: 100vh;
  font-family: sans-serif;
}

/* left-side 3D model viewer */
#viewer-area {
  width: 70%;
  height: 100%;
  background: #222;
}

model-viewer {
  width: 100%;
  height: 100%;
}


#info-area {
  width: 30%;
  padding: 20px;
  overflow-y: auto;
  background: #f5f5f5;
  box-sizing: border-box;
}

label {
  display: block;
  margin-top: 10px;
  margin-bottom: 4px;
  font-weight: bold;
}

select {
  width: 100%;
  padding: 8px;
  margin-bottom: 20px;
  font-size: 16px;
}

h2 {
  margin-top: 0;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  margin-bottom: 16px;
  font-size: 14px;
}

th {
  width: 35%;
  text-align: left;
  vertical-align: top;
  padding: 6px;
  background: #e0e0e0;
}

td {
  padding: 6px;
  background: #ffffff;
}
</style>
</head>

<body>

<!-- left side -->
<div id="viewer-area">
  <model-viewer
  id="viewer"
  src=""
  camera-controls
  auto-rotate
  shadow-intensity="1"
  camera-orbit="45deg 75deg 6m"
  field-of-view="30deg"
  ar>
</model-viewer>
</div>

<!-- right side -->
<div id="info-area">
  <label for="modelSelect">Model</label>
  <select id="modelSelect"></select>

  <div id="description">
    <p>Loading CSV data...</p>
  </div>
</div>

<script>
const viewer = document.getElementById("viewer");
const modelSelect = document.getElementById("modelSelect");
const description = document.getElementById("description");

let models = [];


fetch("DDB.csv")
  .then(response => {
    if (!response.ok) {
      throw new Error("CSV file not found");
    }
    return response.text();
  })
  .then(csvText => {
    models = parseCSV(csvText);
    setupModelSelector(models);

    if (models.length > 0) {

      showModel(models[0]);
    } else {
      description.innerHTML = "<p>No model data found in CSV.</p>";
    }
  })
  .catch(error => {
    console.error("CSV loading error:", error);
    description.innerHTML = "<p>Could not load CSV data.</p>";
  });

function setupModelSelector(models) {
  modelSelect.innerHTML = "";

  models.forEach(model => {
    const option = document.createElement("option");

    const identifier = model.label || model.id || model.file;
    option.value = identifier;
    option.textContent = identifier;
    modelSelect.appendChild(option);
  });
}


function showModel(model) {

  viewer.src = model.file || "";


  description.innerHTML = `
    <h2>${escapeHTML(model.title_en || model.label || model.id)}</h2>

    <table>
      <tr>
        <th>Object type</th>
        <td>${escapeHTML(model.object_type_en)}</td>
      </tr>
      <tr>
        <th>Period</th>
        <td>${escapeHTML(model.period_en)}</td>
      </tr>
      <tr>
        <th>Building</th>
        <td>${escapeHTML(model.Building_en)}</td>
      </tr>
      <tr>
        <th>Site</th>
        <td>${escapeHTML(model.site_en)}</td>
      </tr>
      <tr>
        <th>Location</th>
        <td>
          ${escapeHTML(model.city_en)},
          ${escapeHTML(model.prefecture_en)},
          ${escapeHTML(model.country_en)}
        </td>
      </tr>
      <tr>
        <th>Institution</th>
        <td>${escapeHTML(model.institution_en)}</td>
      </tr>
    </table>
  `;
}


modelSelect.addEventListener("change", function() {
  const selected = models.find(model => (model.label || model.id || model.file) === this.value);
  if (!selected) return;
  showModel(selected);
});


function parseCSV(text) {
  const rows = text.trim().split(/\r?\n/);
  const headers = splitCSVLine(rows[0]).map(h => h.trim());

  return rows.slice(1)
    .filter(row => row.trim() !== "")
    .map(row => {
      const values = splitCSVLine(row);
      const obj = {};

      headers.forEach((header, index) => {
        obj[header] = values[index] ? values[index].trim() : "";
      });

      return obj;
    });
}

function splitCSVLine(line) {
  const delimiter = line.includes("\t") ? "\t" : ",";
  const result = [];
  let current = "";
  let inQuotes = false;

  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    const nextChar = line[i + 1];

    if (char === '"' && inQuotes && nextChar === '"') {
      current += '"';
      i++;
    } else if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === delimiter && !inQuotes) {
      result.push(current);
      current = "";
    } else {
      current += char;
    }
  }

  result.push(current);
  return result;
}


function escapeHTML(str) {
  return String(str || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "'");
}
</script>

</body>
</html>
